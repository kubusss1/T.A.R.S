name: Testy

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testy Python
        run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Skladnia PHP
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Testy logiki wtyczki
        run: php wordpress/tars-bridge/tests/run.php
